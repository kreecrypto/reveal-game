<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <title>ปั้นเกม — เปิดป้ายดิ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/setup.css">
  <link rel="stylesheet" href="/css/share.css">
</head>
<body>
  <main class="app-shell setup-shell" data-ui="main">
    <header class="game-topbar">
      <a class="brand" href="/" data-action="leave-home" aria-label="กลับหน้าเกม">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>ปั้นเกม</span>
      </a>
      <div class="round-chip builder-count"><strong data-ui="count">1</strong>/10 ข้อ</div>
    </header>

    <section class="setup-step panel">
      <h1>ชื่อเกม</h1>
      <input id="game-title" class="text-input text-input-lg" maxlength="80" placeholder="พิมพ์ชื่อเกม" value="เกมของฉัน">
    </section>

    <section class="setup-section-head">
      <h2>คำถาม</h2>
      <button class="button button-ghost" type="button" data-action="add">+ เพิ่มข้อ</button>
    </section>

    <section class="readiness-card" aria-live="polite" hidden>
      <div><strong data-ui="readiness-text">ยังไม่ครบ</strong></div>
      <div class="readiness-progress"><span data-ui="readiness-bar"></span></div>
      <small data-ui="readiness-detail">ใส่รูปกับเฉลยให้ครบ</small>
    </section>

    <section data-ui="items" class="setup-list" aria-live="polite"></section>

    <section class="publish-card panel" aria-live="polite">
      <div class="publish-copy">
        <strong>แชร์เกม</strong>
        <p class="cloud-status" data-ui="cloud-status">กำลังเช็ก...</p>
      </div>
      <button class="button button-primary" type="button" data-action="publish" disabled>แชร์เกม</button>
    </section>

    <section class="setup-footer panel">
      <span class="save-status" data-ui="status">ยังไม่ได้บันทึก</span>
      <strong data-ui="footer-summary" hidden>ยังไม่มีข้อพร้อมลุย</strong>
      <div class="footer-actions">
        <button class="button button-ghost clear-action" type="button" data-action="clear">เริ่มใหม่</button>
        <button class="button button-secondary" type="button" data-action="save">บันทึก</button>
        <button class="button button-primary" type="button" data-action="play">เล่น</button>
      </div>
    </section>
  </main>

  <template id="item-template">
    <article class="question-card panel" data-item>
      <div class="question-card-head">
        <div class="question-no">01</div>
        <span class="item-state" data-field="state">ยังไม่ครบ</span>
        <button class="icon-button danger" type="button" data-action="remove-item" aria-label="ลบข้อนี้">×</button>
      </div>
      <span data-field="number" hidden>1</span>

      <div class="question-grid">
        <div class="upload-block">
          <button class="upload-zone" type="button" data-field="upload-zone" aria-label="เลือกรูปหรือแก้ไขรูป">
            <img data-field="preview" alt="ตัวอย่างรูป">
            <span class="upload-empty" data-field="upload-empty"><strong>เลือกรูป</strong></span>
            <span class="upload-edit-hint" data-field="edit-hint">จัดรูป</span>
          </button>
          <input data-field="file" type="file" accept="image/*" hidden>
          <div class="image-actions is-hidden" data-field="image-actions">
            <button class="text-action" type="button" data-action="edit-image">แก้ภาพ</button>
            <button class="text-action" type="button" data-action="choose-image">เปลี่ยนรูป</button>
          </div>
        </div>

        <div class="question-fields">
          <label class="field-label">เฉลย</label>
          <input class="text-input answer-input" data-field="answer" maxlength="120" placeholder="พิมพ์คำเฉลย">
          <details class="question-options">
            <summary>ปรับคำถาม</summary>
            <label class="field-label" hidden>คำถาม</label>
            <input class="text-input" data-field="question" maxlength="120" value="นี่มันตัวอะไรเนี่ย?">
          </details>
          <div class="item-checklist" data-field="checklist" hidden>
            <span data-check="image">○ มีรูป</span>
            <span data-check="answer">○ มีเฉลย</span>
          </div>
        </div>
      </div>
    </article>
  </template>

  <div class="toast" data-ui="toast" role="status" aria-live="polite">
    <span data-ui="toast-message"></span>
    <button class="toast-undo is-hidden" type="button" data-action="undo-remove">เอาคืน</button>
  </div>

  <div class="game-modal-backdrop is-hidden" data-ui="clear-modal">
    <section class="game-modal" role="dialog" aria-modal="true" aria-labelledby="clear-modal-title" tabindex="-1">
      <div class="game-modal-icon" aria-hidden="true">?</div>
      <h2 id="clear-modal-title">เริ่มใหม่?</h2>
      <p>ข้อมูลเกมในเครื่องจะถูกล้าง</p>
      <div class="game-modal-actions">
        <button class="button button-ghost" type="button" data-action="cancel-clear">ยกเลิก</button>
        <button class="button button-secondary" type="button" data-action="confirm-clear">ล้างเกม</button>
      </div>
    </section>
  </div>

  <div class="game-modal-backdrop is-hidden" data-ui="leave-modal">
    <section class="game-modal" role="dialog" aria-modal="true" aria-labelledby="leave-modal-title" aria-describedby="leave-modal-desc" tabindex="-1">
      <div class="game-modal-icon" aria-hidden="true">!</div>
      <h2 id="leave-modal-title">ยังไม่ได้บันทึก</h2>
      <p id="leave-modal-desc">ออกตอนนี้ การแก้ไขล่าสุดจะหาย</p>
      <div class="game-modal-actions">
        <button class="button button-ghost" type="button" data-action="cancel-leave">อยู่ต่อ</button>
        <button class="button button-secondary" type="button" data-action="discard-leave">ออกโดยไม่บันทึก</button>
      </div>
    </section>
  </div>

  <div class="game-modal-backdrop image-editor-backdrop is-hidden" data-ui="image-editor-modal">
    <section class="game-modal image-editor-modal" role="dialog" aria-modal="true" aria-labelledby="image-editor-title" tabindex="-1">
      <div class="image-editor-head">
        <h2 id="image-editor-title">จัดรูป</h2>
        <button class="icon-button" type="button" data-action="cancel-image-edit" aria-label="ปิดตัวแก้ไขรูป">×</button>
      </div>

      <div class="image-editor-workspace">
        <div class="image-editor-stage" data-ui="image-editor-stage">
          <canvas data-ui="image-editor-canvas" width="1024" height="1024" aria-label="พื้นที่ครอปรูปแบบสี่เหลี่ยมจัตุรัส"></canvas>
          <div class="crop-grid" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          <div class="crop-badge" aria-hidden="true">1:1</div>
        </div>

        <div class="image-editor-controls">
          <div class="zoom-control">
            <div class="zoom-control-head">
              <label for="image-zoom">ซูม</label>
              <output for="image-zoom" data-ui="zoom-value">1.00×</output>
            </div>
            <div class="zoom-row">
              <button class="zoom-step" type="button" data-action="zoom-out" aria-label="ย่อรูป">−</button>
              <input id="image-zoom" data-ui="image-zoom" type="range" min="1" max="3" step="0.01" value="1" aria-label="ย่อหรือขยายรูป">
              <button class="zoom-step" type="button" data-action="zoom-in" aria-label="ขยายรูป">+</button>
            </div>
          </div>
          <div class="editor-tip">ลากเพื่อเลื่อน · สองนิ้วเพื่อซูม</div>
          <button class="button button-ghost editor-reset" type="button" data-action="reset-image-edit">จัดกลาง</button>
        </div>
      </div>

      <div class="game-modal-actions image-editor-actions">
        <button class="button button-ghost" type="button" data-action="cancel-image-edit">ยกเลิก</button>
        <button class="button button-primary" type="button" data-action="apply-image-edit">ใช้รูปนี้</button>
      </div>
    </section>
  </div>

  <div class="game-modal-backdrop is-hidden" data-ui="share-modal">
    <section class="game-modal share-modal" role="dialog" aria-modal="true" aria-labelledby="share-modal-title" tabindex="-1">
      <div class="image-editor-head">
        <h2 id="share-modal-title">แชร์เกม</h2>
        <button class="icon-button" type="button" data-action="close-share" aria-label="ปิดหน้าต่างแชร์">×</button>
      </div>

      <div class="share-field">
        <label for="share-link">ลิงก์เล่น</label>
        <div class="share-field-row">
          <input id="share-link" data-ui="share-link" readonly>
          <button class="button button-secondary" type="button" data-action="copy-share">คัดลอก</button>
        </div>
      </div>

      <div class="share-field">
        <label for="edit-link">ลิงก์แก้ไข · ห้ามแชร์</label>
        <div class="share-field-row">
          <input id="edit-link" data-ui="edit-link" readonly>
          <button class="button button-ghost" type="button" data-action="copy-edit">คัดลอก</button>
        </div>
      </div>

      <div class="share-actions">
        <button class="button button-primary is-hidden" type="button" data-action="native-share">แชร์</button>
        <button class="button button-secondary" type="button" data-action="open-shared">เปิดเกม</button>
        <button class="button button-ghost" type="button" data-action="close-share">ปิด</button>
      </div>
    </section>
  </div>

  <script src="/js/storage.js"></script>
  <script src="/js/share-api.js" defer></script>
  <script src="/js/setup.js" defer></script>
  <script src="/js/publish.js" defer></script>
</body>
</html>
