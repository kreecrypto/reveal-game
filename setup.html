<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <title>สร้างเกม — เปิดป้ายดิ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/setup.css">
</head>
<body>
  <main class="app-shell setup-shell">
    <header class="game-topbar">
      <a class="brand" href="/" aria-label="กลับหน้าเกม">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>สร้างเกม</span>
      </a>
      <div class="round-chip"><strong data-ui="count">1</strong>/10 รูป</div>
    </header>

    <section class="setup-step panel">
      <div class="step-kicker"><span>1</span> ตั้งชื่อเกม</div>
      <h1>เกมนี้ชื่ออะไร?</h1>
      <p>ตั้งชื่อสั้น ๆ ให้จำง่าย เช่น “ทายภาพสัตว์”</p>
      <input id="game-title" class="text-input text-input-lg" maxlength="80" placeholder="ชื่อเกม" value="เกมของฉัน">
    </section>

    <section class="setup-section-head">
      <div>
        <div class="step-kicker"><span>2</span> เพิ่มรูปและเฉลย</div>
        <h2>สร้างข้อคำถาม</h2>
        <p>แต่ละข้อใช้รูป 1 รูป + คำเฉลย 1 คำ</p>
      </div>
      <button class="button button-ghost" type="button" data-action="add">+ เพิ่มข้อ</button>
    </section>

    <section class="readiness-card" aria-live="polite">
      <div>
        <span class="readiness-label">ความพร้อมของเกม</span>
        <strong data-ui="readiness-text">ยังไม่พร้อมเล่น</strong>
      </div>
      <div class="readiness-progress"><span data-ui="readiness-bar"></span></div>
      <small data-ui="readiness-detail">เพิ่มรูปและคำเฉลยอย่างน้อย 1 ข้อ</small>
    </section>

    <section data-ui="items" class="setup-list" aria-live="polite"></section>

    <section class="setup-footer panel">
      <div>
        <span class="save-status" data-ui="status">ข้อมูลจะบันทึกอยู่ในเครื่องนี้</span>
        <strong data-ui="footer-summary">0 ข้อพร้อมเล่น</strong>
      </div>
      <div class="footer-actions">
        <button class="button button-ghost" type="button" data-action="clear">เริ่มใหม่</button>
        <button class="button button-secondary" type="button" data-action="save">บันทึก</button>
        <button class="button button-primary" type="button" data-action="play">เริ่มเล่น</button>
      </div>
    </section>
  </main>

  <template id="item-template">
    <article class="question-card panel" data-item>
      <div class="question-card-head">
        <div class="question-no">01</div>
        <div>
          <strong>ข้อที่ <span data-field="number">1</span></strong>
          <span class="item-state" data-field="state">ยังไม่พร้อม</span>
        </div>
        <button class="icon-button danger" type="button" data-action="remove-item" aria-label="ลบข้อนี้">×</button>
      </div>

      <div class="question-grid">
        <div class="upload-block">
          <div class="mini-label">รูปภาพ</div>
          <button class="upload-zone" type="button" data-field="upload-zone">
            <img data-field="preview" alt="ตัวอย่างรูป">
            <span class="upload-empty" data-field="upload-empty">
              <strong>เลือกรูป</strong>
              <small>แตะเพื่ออัปโหลดจากเครื่อง</small>
            </span>
          </button>
          <input data-field="file" type="file" accept="image/*" hidden>
          <button class="text-action is-hidden" type="button" data-action="choose-image">เปลี่ยนรูป</button>
        </div>

        <div class="question-fields">
          <label class="field-label">คำเฉลย <span>จำเป็น</span></label>
          <input class="text-input answer-input" data-field="answer" maxlength="120" placeholder="เช่น แมว">
          <label class="field-label">คำถาม <span class="optional">ไม่บังคับ</span></label>
          <input class="text-input" data-field="question" maxlength="120" value="ภาพนี้คืออะไร?">
          <div class="item-checklist" data-field="checklist">
            <span data-check="image">○ มีรูป</span>
            <span data-check="answer">○ มีเฉลย</span>
          </div>
        </div>
      </div>
    </article>
  </template>

  <div class="toast" data-ui="toast" role="status" aria-live="polite"></div>
  <div class="version-badge">v20.2</div>
  <script src="/js/storage.js"></script>
  <script src="/js/setup.js" defer></script>
</body>
</html>
