name: Cloudflare v21

on:
  push:
    branches: [v21-shareable-game, main]
    paths:
      - 'cloudflare/migrations/0004_shareable_games.sql'
      - 'cloudflare-v21/**'
      - '.github/workflows/cloudflare-v21.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Apply D1 migration
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler d1 migrations apply reveal-game-db --remote

      - name: Deploy share worker
        working-directory: cloudflare-v21
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy
