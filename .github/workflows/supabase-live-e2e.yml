name: Supabase Live E2E

on:
  push:
    branches:
      - v21-shareable-game
    paths:
      - 'js/share-api.js'
      - 'js/publish.js'
      - 'tests/supabase-live.spec.js'
      - '.github/workflows/supabase-live-e2e.yml'
  workflow_dispatch:

jobs:
  live-share:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Real Supabase browser E2E
        env:
          SUPABASE_LIVE_E2E: '1'
        run: npx playwright test tests/supabase-live.spec.js --project=chromium

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-live-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
