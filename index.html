<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff86bf">
<title>เปิดป้ายดิ — Cute Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4d3b70;--muted:#7d7190;--pink:#ff73b5;--pink2:#ff9dcc;--blue:#6bd7f2;--violet:#8b74f0;--yellow:#ffd960;--green:#7bd98b;--line:#e4d8f5;--shadow:#c7b3e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 8%,#fff 0 48px,transparent 50px),radial-gradient(circle at 90% 14%,#fff 0 34px,transparent 36px),linear-gradient(#c6f1ff,#e7ddff 46%,#fff0f7 78%,#fff8d8);padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{width:min(100%,980px);margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:0 0 22px 22px;padding:9px 11px;box-shadow:0 6px 0 var(--shadow);margin-bottom:18px}.brand{display:flex;align-items:center;gap:9px;font:600 19px Mitr,sans-serif}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(#ffb6dc,#ff70b3);box-shadow:0 4px 0 #d64b91;color:#fff}.hud{display:flex;gap:6px}.chip{border:2px solid #ffe275;background:#fff8c8;border-radius:999px;padding:7px 9px;font:600 12px Mitr,sans-serif}.screen{display:none}.screen.is-active{display:block}.card{background:linear-gradient(145deg,#fff,#fff6fb 60%,#fff8d5);border:4px solid #fff;border-radius:30px;box-shadow:0 8px 0 var(--shadow),0 18px 36px #62448a22;padding:24px 18px}.tag{display:inline-flex;align-items:center;gap:6px;border:2px solid #ffdb64;background:#fff1b2;border-radius:999px;padding:6px 10px;font:600 11px Mitr,sans-serif}.hero h1{font:700 clamp(38px,10vw,64px)/1.05 Mitr,sans-serif;margin:10px 0;color:#553d81}.hero h1 b{color:var(--pink)}.hero p{color:var(--muted);line-height:1.65;max-width:620px}.btn{min-height:50px;border:2px solid #fff;border-radius:17px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 15px Mitr,sans-serif;color:#fff;background:linear-gradient(#ff9dce,#ff68ad);box-shadow:0 6px 0 #cf4389}.btn.alt{background:linear-gradient(#87e0f6,#59caeb);box-shadow:0 6px 0 #38a9c9;color:#2b536a}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a74178}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.section{margin-top:28px}.section h2{font:600 27px Mitr,sans-serif;margin:0 0 12px}.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mission{background:#fff;border:4px solid #fff;border-radius:24px;box-shadow:0 7px 0 var(--shadow);overflow:hidden}.mission-art{height:150px;display:grid;place-items:center;background:linear-gradient(145deg,#eadfff,#d5f7ff 62%,#fff3ba)}.mission-art svg{width:84px;height:84px}.mission-body{padding:14px}.mission h3{font:600 20px Mitr,sans-serif;margin:0 0 4px}.mission p{font-size:13px;color:var(--muted);min-height:42px}.mission .btn{width:100%;min-height:44px;font-size:13px}.play-card{background:#fff;border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:14px}.play-head{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border-bottom:2px dashed #eadcf8;padding-bottom:10px}.round-box{width:52px;height:52px;border-radius:15px;background:linear-gradient(#a28df8,#7a61e8);color:#fff;display:grid;place-items:center;font:600 19px Mitr,sans-serif;box-shadow:0 4px 0 #5a45bd}.progress{height:10px;background:#efe8fa;border:2px solid #dfd3f2;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yellow))}.score{font:700 18px Mitr,sans-serif;color:#ef5ba0}.question{font:600 clamp(23px,6vw,33px) Mitr,sans-serif;margin:16px 0 10px}.board{position:relative;width:100%;aspect-ratio:1;border:5px solid #fff;border-radius:24px;background:#8068e8;box-shadow:0 7px 0 #654ecb;overflow:hidden}.picture{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff5bd,#ffdcef,#dff8ff)}.picture svg{width:38%;height:38%}.tiles{position:absolute;inset:0;display:grid;gap:5px;padding:6px}.tile{border:2px solid #fff;border-radius:13px;background:linear-gradient(#ff9ece,#ff6fad);box-shadow:0 4px 0 #c84989;color:#fff;font:600 16px Mitr,sans-serif}.tile:nth-child(3n+2){background:linear-gradient(#7cdef6,#4fc4e6);box-shadow:0 4px 0 #2fa8c9}.tile:nth-child(4n){background:linear-gradient(#ffdc6c,#ffc142);box-shadow:0 4px 0 #dfa52e;color:#6c4c13}.tile.is-open{opacity:0;pointer-events:none}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools .btn{min-height:44px;font-size:13px}.answer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.answer input{height:54px;border:3px solid #ddcff3;border-radius:17px;background:#fff;color:var(--ink);padding:0 14px;font-size:16px;outline:none}.answer input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ff76b421}.message{min-height:30px;padding-top:8px;font-weight:700}.hidden{display:none!important}.result{text-align:center;max-width:620px;margin:auto}.result h1{font:700 36px Mitr,sans-serif;margin:8px}.big{font:700 62px Mitr,sans-serif;color:var(--pink)}.stars{display:flex;justify-content:center;gap:6px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats div{background:#fff;border:2px solid var(--line);border-radius:15px;padding:10px}.stats small{display:block;color:var(--muted);font-size:11px}.stats strong{font:600 22px Mitr,sans-serif}.icon{width:1.25em;height:1.25em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.version{position:fixed;right:8px;bottom:8px;font:500 10px Mitr,sans-serif;color:#76698b;background:#ffffffbb;border:1px solid #e6dcf4;border-radius:999px;padding:4px 7px;z-index:50}
@media(max-width:760px){.missions{grid-template-columns:1fr}.play-head{grid-template-columns:46px 1fr}.score{grid-column:1/-1;text-align:right}.answer{grid-template-columns:1fr}.answer .btn{width:100%}.top{margin-left:-12px;margin-right:-12px;padding-left:14px;padding-right:14px}.brand{font-size:17px}.chip{font-size:11px}.stats{grid-template-columns:1fr 1fr}.actions .btn{flex:1 1 150px}}@media(max-width:390px){.hud .chip:nth-child(2){display:none}.hero h1{font-size:40px}.section h2{font-size:24px}.big{font-size:52px}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
<symbol id="ico-game" viewBox="0 0 64 64"><rect x="8" y="18" width="48" height="30" rx="12" fill="#fff" stroke="currentColor"/><path d="M20 29v10M15 34h10M41 31h.1M47 37h.1"/></symbol>
<symbol id="ico-play" viewBox="0 0 64 64"><path d="M24 16 49 32 24 48z" fill="currentColor" stroke="none"/></symbol>
<symbol id="ico-star" viewBox="0 0 64 64"><path d="m32 7 7 15 16 2-12 11 3 16-14-8-14 8 3-16L9 24l16-2z" fill="#ffd861" stroke="#d9a32b"/></symbol>
<symbol id="ico-bulb" viewBox="0 0 64 64"><path d="M21 27a11 11 0 1 1 22 0c0 8-7 9-7 17h-8c0-8-7-9-7-17z"/><path d="M27 49h10M29 55h6"/></symbol>
<symbol id="ico-eye" viewBox="0 0 64 64"><path d="M7 32s9-14 25-14 25 14 25 14-9 14-25 14S7 32 7 32z"/><circle cx="32" cy="32" r="7"/></symbol>
<symbol id="ico-trophy" viewBox="0 0 64 64"><path d="M20 10h24v12c0 11-5 18-12 18s-12-7-12-18z" fill="#ffd861" stroke="#b68426"/><path d="M20 17H10v5c0 8 5 12 12 12M44 17h10v5c0 8-5 12-12 12M32 40v8M22 54h20"/></symbol>
<symbol id="pic-cat" viewBox="0 0 80 80"><path d="M20 29 24 14l14 10h4l14-10 4 15v18c0 14-9 23-20 23S20 61 20 47z" fill="#ffd1df" stroke="#8f6076"/><path d="M31 43h.1M49 43h.1M34 53c4 3 8 3 12 0"/></symbol>
<symbol id="pic-dog" viewBox="0 0 80 80"><path d="M23 24 12 17l2 26 12 2M57 24l11-7-2 26-12 2" fill="#dba86c" stroke="#865b39"/><path d="M22 29c0-10 8-16 18-16s18 6 18 16v20c0 12-8 21-18 21s-18-9-18-21z" fill="#f0bd7f" stroke="#865b39"/><path d="M31 42h.1M49 42h.1M36 50h8l-4 5z"/></symbol>
<symbol id="pic-panda" viewBox="0 0 80 80"><circle cx="24" cy="22" r="10" fill="#3a3651"/><circle cx="56" cy="22" r="10" fill="#3a3651"/><circle cx="40" cy="43" r="27" fill="#fff" stroke="#5b5672"/><ellipse cx="30" cy="40" rx="7" ry="10" fill="#3a3651"/><ellipse cx="50" cy="40" rx="7" ry="10" fill="#3a3651"/><circle cx="30" cy="40" r="2" fill="#fff"/><circle cx="50" cy="40" r="2" fill="#fff"/><path d="M36 53h8l-4 4z" fill="#3a3651"/></symbol>
</defs></svg>
<main class="app">
<header class="top"><div class="brand"><div class="logo"><svg class="icon"><use href="#ico-game"/></svg></div>เปิดป้ายดิ</div><div class="hud"><div class="chip">แต้ม <b data-ui="hud-score">0</b></div><div class="chip">ด่าน <b data-ui="hud-round">1/3</b></div></div></header>
<section class="screen is-active" data-screen="home"><div class="card hero"><span class="tag"><svg class="icon"><use href="#ico-star"/></svg>คิวต์แต่ป่วน</span><h1>เปิดน้อยๆ<br><b>เดี๋ยวแต้มปลิว!</b></h1><p>ค่อยๆ แง้ม แล้วเดาให้ไว เปิดหมดไม่ผิดหรอก...แค่แต้มมันเศร้าเฉยๆ</p><div class="actions"><button class="btn" data-action="quick-play"><svg class="icon"><use href="#ico-play"/></svg>เอาดิ ลุยเลย</button></div></div><div class="section"><h2>เลือกด่าน แล้วไปป่วนกัน</h2><div class="missions" data-ui="missions"></div></div></section>
<section class="screen" data-screen="game"><div class="play-card"><div class="play-head"><div class="round-box" data-ui="round-no">01</div><div><div data-ui="round-label" style="font:600 12px Mitr">รอบ 1 / 3</div><div class="progress"><i data-ui="progress" style="width:33%"></i></div></div><div class="score"><span data-ui="round-score">1000</span> แต้ม</div></div><h2 class="question" data-ui="question"></h2><div class="board"><div class="picture" data-ui="picture"></div><div class="tiles" data-ui="tiles"></div></div><div class="tools"><button class="btn alt" data-action="hint"><svg class="icon"><use href="#ico-bulb"/></svg>ใบ้ให้ก็ได้</button><button class="btn alt" data-action="reveal"><svg class="icon"><use href="#ico-eye"/></svg>แอบดูเฉลย</button></div><div class="answer"><input data-ui="guess" placeholder="พิมพ์มาเลย เดี๋ยวรู้กัน..." autocomplete="off" autocorrect="off" enterkeyhint="done"><button class="btn" data-action="submit">ล็อกคำตอบ!</button></div><div class="message" data-ui="message"></div><div class="actions hidden" data-ui="next-wrap"><button class="btn" data-action="next">ไปต่อดิ</button></div></div></section>
<section class="screen" data-screen="result"><div class="card result"><svg class="icon" style="width:86px;height:86px;color:#d19a25"><use href="#ico-trophy"/></svg><h1>รอดเฉย!</h1><div class="stars" data-ui="stars"></div><div class="big" data-ui="final-score">0</div><div>แต้มรวม แบบไม่โกงนะ</div><div class="stats"><div><small>เดาถูก</small><strong data-ui="correct">0/3</strong></div><div><small>แง้มไป</small><strong data-ui="opened">0</strong></div><div><small>พลาดไป</small><strong data-ui="wrong">0</strong></div></div><div class="actions"><button class="btn" data-action="again">เอาใหม่ดิ</button><button class="btn alt" data-action="home">กลับไปเลือกด่าน</button></div></div></section>
</main>
<div class="version">v16</div>
<script>
(()=>{
'use strict';
const q=(s,r=document)=>r.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)];
const ui=n=>q(`[data-ui="${n}"]`),action=n=>q(`[data-action="${n}"]`);
const MISSIONS=[
{id:'cat',title:'เจ้าเหมียวสายลับ',desc:'ตัวแรกเบาๆ อย่าเพิ่งรีบเปิดหมด',pic:'pic-cat',q:'ใครทำหน้าเหมือนไม่สนใจโลก?',answers:['แมว','cat'],hint:'ชอบกล่อง ชอบนอน ชอบเมินเรา',grid:3},
{id:'dog',title:'เจ้าตูบจับโป๊ะ',desc:'รอบนี้เริ่มตึงนิดนึง',pic:'pic-dog',q:'ใครดีใจเหมือนเราเพิ่งกลับจากต่างดาว?',answers:['หมา','สุนัข','dog'],hint:'หางนี่ฟ้องหมดแล้ว',grid:4},
{id:'panda',title:'แพนด้าหน้าง่วง',desc:'น่ารักแต่เปิดเยอะก็โดนหักนะ',pic:'pic-panda',q:'ใครใส่แว่นดำมาตั้งแต่เกิด?',answers:['แพนด้า','panda'],hint:'ดำขาว กินไผ่ ไม่ใช่ม้าลาย',grid:4}
];
const state={round:0,total:0,totalOpened:0,totalWrong:0,correct:0,opened:new Set(),done:false,hinted:false,startRound:0};
const icon=id=>`<svg class="icon"><use href="#${id}"/></svg>`;
function show(name){qa('.screen').forEach(el=>el.classList.toggle('is-active',el.dataset.screen===name));try{window.scrollTo(0,0)}catch(_){document.documentElement.scrollTop=0;document.body.scrollTop=0}}
function score(){return Math.max(0,1000-state.opened.size*50-state.roundWrong*100-(state.hinted?150:0))}
function renderMissions(){ui('missions').innerHTML=MISSIONS.map((m,i)=>`<article class="mission"><div class="mission-art"><svg class="icon"><use href="#${m.pic}"/></svg></div><div class="mission-body"><h3>${m.title}</h3><p>${m.desc}</p><button class="btn" data-start="${i}">${icon('ico-play')}เล่นด่านนี้</button></div></article>`).join('');qa('[data-start]').forEach(btn=>btn.addEventListener('click',()=>start(Number(btn.dataset.start))))}
function start(index=0){state.round=index;state.startRound=index;state.total=0;state.totalOpened=0;state.totalWrong=0;state.correct=0;loadRound();show('game')}
function loadRound(){state.opened=new Set();state.done=false;state.hinted=false;state.roundWrong=0;ui('message').textContent='';ui('guess').value='';ui('next-wrap').classList.add('hidden');draw()}
function draw(){const r=MISSIONS[state.round];ui('hud-score').textContent=state.total.toLocaleString();ui('hud-round').textContent=`${state.round+1}/${MISSIONS.length}`;ui('round-no').textContent=String(state.round+1).padStart(2,'0');ui('round-label').textContent=`รอบ ${state.round+1} / ${MISSIONS.length}`;ui('progress').style.width=`${((state.round+1)/MISSIONS.length)*100}%`;ui('round-score').textContent=score();ui('question').textContent=r.q;ui('picture').innerHTML=`<svg class="icon"><use href="#${r.pic}"/></svg>`;ui('tiles').style.gridTemplateColumns=`repeat(${r.grid},1fr)`;ui('tiles').innerHTML=Array.from({length:r.grid*r.grid},(_,i)=>`<button class="tile ${state.opened.has(i)?'is-open':''}" data-tile="${i}" ${state.done?'disabled':''}>${i+1}</button>`).join('');qa('[data-tile]').forEach(btn=>btn.addEventListener('click',()=>openTile(Number(btn.dataset.tile))));action('hint').disabled=state.hinted||state.done;action('reveal').disabled=state.done;action('submit').disabled=state.done;ui('guess').disabled=state.done}
function openTile(i){if(state.done||state.opened.has(i))return;state.opened.add(i);state.totalOpened++;draw()}
function submit(){if(state.done)return;const r=MISSIONS[state.round];const value=ui('guess').value.trim().toLowerCase();if(!value){ui('message').textContent='พิมพ์คำตอบก่อนดิ';ui('message').style.color='#d77d22';return}if(r.answers.some(a=>a.toLowerCase()===value)){const gained=score();state.total+=gained;state.correct++;state.done=true;ui('message').textContent=`เอ้า ถูกเฉย! +${gained.toLocaleString()} แต้ม`;ui('message').style.color='#48a84d';for(let i=0;i<r.grid*r.grid;i++)state.opened.add(i);ui('next-wrap').classList.remove('hidden');action('next').textContent=state.round===MISSIONS.length-1?'ไปดูผลงาน':'ไปต่อดิ';draw()}else{state.roundWrong++;state.totalWrong++;ui('message').textContent='อุ๊ย ไม่ใช่! แง้มเพิ่มอีกหน่อยมั้ย';ui('message').style.color='#e35182';ui('guess').value='';draw()}}
function hint(){if(state.hinted||state.done)return;state.hinted=true;ui('message').textContent='ใบ้ให้ละนะ: '+MISSIONS[state.round].hint;ui('message').style.color='#6c5ac8';draw()}
function reveal(){if(state.done)return;const r=MISSIONS[state.round];state.done=true;ui('message').textContent=`เฉลยให้ก็ได้: ${r.answers[0]}`;ui('message').style.color='#6c5ac8';for(let i=0;i<r.grid*r.grid;i++)state.opened.add(i);ui('next-wrap').classList.remove('hidden');action('next').textContent=state.round===MISSIONS.length-1?'ไปดูผลงาน':'ไปต่อดิ';draw()}
function next(){if(state.round<MISSIONS.length-1){state.round++;loadRound()}else finish()}
function finish(){show('result');ui('final-score').textContent=state.total.toLocaleString();ui('correct').textContent=`${state.correct}/${MISSIONS.length-state.startRound}`;ui('opened').textContent=state.totalOpened;ui('wrong').textContent=state.totalWrong;const played=MISSIONS.length-state.startRound;const ratio=played?state.correct/played:0;const stars=ratio===1?3:ratio>=.66?2:ratio>0?1:0;ui('stars').innerHTML=Array.from({length:3},(_,i)=>`<svg class="icon" style="width:34px;height:34px;color:${i<stars?'#d9a32b':'#d9cce9'};fill:${i<stars?'#ffd861':'#fff'}"><use href="#ico-star"/></svg>`).join('')}
renderMissions();
action('quick-play').addEventListener('click',()=>start(0));action('submit').addEventListener('click',submit);ui('guess').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});action('hint').addEventListener('click',hint);action('reveal').addEventListener('click',reveal);action('next').addEventListener('click',next);action('again').addEventListener('click',()=>start(0));action('home').addEventListener('click',()=>show('home'));
})();
</script>
</body></html>
