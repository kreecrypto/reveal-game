<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <title>เปิดป้ายดิ — Reveal Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/game.css">
</head>
<body data-screen="home">
  <main class="app-shell">
    <header class="game-topbar">
      <a class="brand" href="#" data-action="home" aria-label="กลับหน้าแรก">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>เปิดป้ายดิ</span>
      </a>
      <div class="round-chip" aria-live="polite">ข้อ <strong data-ui="counter">1/10</strong></div>
    </header>

    <section class="screen is-active" data-screen="home">
      <div class="panel hero-panel">
        <h1>เปิดป้าย<br><span>แล้วทายภาพ</span></h1>
        <div class="game-summary">
          <strong data-ui="game-title">กำลังโหลด...</strong>
        </div>
        <div class="action-row home-actions">
          <button class="button button-primary button-lg" data-action="start">
            <span class="button-icon play-icon" aria-hidden="true"></span>
            เล่น
          </button>
          <a class="button button-ghost button-lg" href="/setup.html">สร้าง / แก้เกม</a>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="game">
      <div class="panel game-panel">
        <div class="game-meta">
          <div class="progress-track" aria-hidden="true"><span data-ui="progress"></span></div>
        </div>

        <div class="question-block">
          <h2 data-ui="question">นี่มันตัวอะไรเนี่ย?</h2>
        </div>

        <div class="reveal-board" data-ui="board">
          <img class="answer-image" data-ui="image" alt="ภาพคำถาม">
          <div class="tile-grid" data-ui="tiles" aria-label="ป้ายหมายเลข 1 ถึง 9"></div>
        </div>

        <div class="answer-panel is-hidden" data-ui="answer-panel" aria-live="polite">
          <span class="answer-label">เฉลย</span>
          <strong data-ui="answer"></strong>
        </div>

        <div class="action-row game-actions">
          <button class="button button-secondary" data-action="reveal">ดูเฉลย</button>
          <button class="button button-primary is-hidden" data-action="next">ข้อต่อไป</button>
        </div>
      </div>
    </section>

    <section class="screen" data-screen="done">
      <div class="panel finish-panel">
        <div class="finish-icon" aria-hidden="true">★</div>
        <h2>จบเกม!</h2>
        <div class="action-row action-row-centered">
          <button class="button button-primary" data-action="restart">เล่นอีกครั้ง</button>
          <a class="button button-secondary" href="/setup.html">สร้างเกม</a>
          <button class="button button-ghost" data-action="home">หน้าแรก</button>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/storage.js"></script>
  <script src="/js/share-api.js" defer></script>
  <script src="/js/game.js" defer></script>
</body>
</html>
