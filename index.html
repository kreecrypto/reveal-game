<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff8fcf"><title>เปิดป้ายดิ — Recovery v15</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
@font-face{font-family:"Mi Latte";src:url('/fonts/mi-latte-regular.woff2') format('woff2');font-display:swap}
:root{--ink:#4b386e;--muted:#7b6c91;--pink:#ff75b5;--pink2:#ffb0d6;--blue:#67d5f3;--vio:#8a72ef;--yellow:#ffd861;--green:#8ee081;--line:#decdf6;--shadow:#c3afe8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff 0 52px,transparent 54px),radial-gradient(circle at 85% 15%,#fff 0 42px,transparent 44px),linear-gradient(#bfeeff,#eadcff 46%,#fff0f8 80%,#fff8d8);background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom)}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{max-width:980px;margin:auto;padding:12px 12px calc(26px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:3px solid #fff;border-radius:0 0 22px 22px;box-shadow:0 6px 0 var(--shadow);padding:8px 10px;margin-bottom:18px}.brand{font-family:"Mi Latte","Mitr",sans-serif;font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(#ffb6da,#ff72b4);box-shadow:0 4px 0 #d54a92;display:grid;place-items:center;color:#fff}.hud{display:flex;gap:6px}.chip{background:#fff7c8;border:2px solid #ffe07a;border-radius:999px;padding:7px 9px;font:600 12px "Mitr",sans-serif}.screen{display:none}.screen.on{display:block}.hero{background:linear-gradient(145deg,#fff,#fff5fb 55%,#fff7ce);border:4px solid #fff;border-radius:30px;box-shadow:0 8px 0 var(--shadow),0 20px 38px rgba(92,65,137,.14);padding:28px 22px}.hero h1{font:600 clamp(38px,10vw,66px)/1.05 "Mi Latte","Mitr",sans-serif;margin:8px 0;color:#533b7f}.hero h1 b{color:var(--pink)}.hero p{color:var(--muted);line-height:1.6;max-width:620px}.btn{min-height:50px;border:2px solid #fff;border-radius:17px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 15px "Mi Latte","Mitr",sans-serif;color:#fff;background:linear-gradient(#ff98ca,#ff68ab);box-shadow:0 6px 0 #ce438a;text-decoration:none}.btn.alt{background:linear-gradient(#83def5,#55c6e8);box-shadow:0 6px 0 #35a6c8;color:#2f4762}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a73c78}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.tag{display:inline-flex;align-items:center;gap:6px;background:#fff2b8;border:2px solid #ffd95b;border-radius:999px;padding:6px 10px;font:600 11px "Mitr",sans-serif}.section{margin-top:28px}.section h2{font:600 28px "Mi Latte","Mitr",sans-serif;margin:0 0 12px}.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.mission{background:#fff;border:4px solid #fff;border-radius:24px;box-shadow:0 7px 0 var(--shadow);overflow:hidden}.art{height:150px;display:grid;place-items:center;background:linear-gradient(145deg,#eadfff,#d5f6ff 60%,#fff3b8)}.art svg{width:82px;height:82px}.mBody{padding:14px}.mBody h3{font:600 20px "Mi Latte","Mitr",sans-serif;margin:0 0 4px}.mBody p{font-size:13px;color:var(--muted);min-height:42px}.mBody .btn{width:100%;min-height:44px;font-size:13px}.playCard{background:#fff;border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:14px}.playHead{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;border-bottom:2px dashed #eadcf8;padding-bottom:10px}.roundBox{width:52px;height:52px;border-radius:15px;background:linear-gradient(#a28df8,#7a61e8);color:white;display:grid;place-items:center;font:600 19px "Mitr",sans-serif;box-shadow:0 4px 0 #5a45bd}.progress{height:10px;background:#eee5fa;border:2px solid #ddcff4;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yellow))}.score{font:700 18px "Mitr",sans-serif;color:#ef5ba0}.question{font:600 clamp(24px,6vw,34px) "Mi Latte","Mitr",sans-serif;margin:16px 0 10px}.board{position:relative;aspect-ratio:1;border:6px solid #fff;border-radius:24px;background:#8068e8;box-shadow:0 7px 0 #654ecb;overflow:hidden}.picture{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff5bd,#ffdcef,#dff8ff)}.picture svg{width:38%;height:38%}.tiles{position:absolute;inset:0;display:grid;gap:5px;padding:6px}.tile{border:2px solid #fff;border-radius:13px;background:linear-gradient(#ff9ece,#ff6fad);box-shadow:0 4px 0 #c84989;color:white;font:600 16px "Mitr",sans-serif}.tile:nth-child(3n+2){background:linear-gradient(#7cdef6,#4fc4e6);box-shadow:0 4px 0 #2fa8c9}.tile:nth-child(4n){background:linear-gradient(#ffdc6c,#ffc142);box-shadow:0 4px 0 #dfa52e;color:#6c4c13}.tile.open{opacity:0;pointer-events:none}.answer{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:14px}.answer input{height:54px;border:3px solid #d9caf2;border-radius:17px;background:#fff;color:var(--ink);padding:0 14px;font-size:16px;outline:none}.answer input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ff76b41f}.msg{min-height:30px;padding-top:8px;font-weight:700}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools .btn{min-height:44px;font-size:13px}.result{max-width:620px;margin:auto;text-align:center;background:linear-gradient(#fff,#fff6fb 55%,#fff7cf);border:4px solid #fff;border-radius:30px;box-shadow:0 8px 0 var(--shadow);padding:28px 20px}.result h1{font:600 36px "Mi Latte","Mitr",sans-serif;margin:8px}.big{font:700 62px "Mi Latte","Mitr",sans-serif;color:var(--pink)}.stars{display:flex;justify-content:center;gap:6px}.stars svg{width:34px;height:34px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stats div{background:#fff;border:2px solid #eadcf7;border-radius:15px;padding:10px}.stats small{display:block;color:var(--muted);font-size:11px}.stats strong{font:600 22px "Mitr",sans-serif}.icon{width:1.25em;height:1.25em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fill{fill:currentColor;stroke:none}.hidden{display:none!important}@media(max-width:760px){.missions{grid-template-columns:1fr}.hero{padding:21px 16px}.playHead{grid-template-columns:46px 1fr}.score{grid-column:1/-1;text-align:right}.answer{grid-template-columns:1fr}.answer .btn{width:100%}.board{border-width:4px}.tile{min-height:44px}.top{margin-left:-12px;margin-right:-12px;padding-left:14px;padding-right:14px}.brand{font-size:17px}.chip{font-size:11px}.stats{grid-template-columns:1fr 1fr}.actions .btn{flex:1 1 160px}}@media(max-width:390px){.hud .chip:nth-child(2){display:none}.hero h1{font-size:40px}.section h2{font-size:24px}.result{padding:22px 12px}.big{font-size:52px}}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><symbol id="game" viewBox="0 0 64 64"><rect x="8" y="18" width="48" height="30" rx="12" fill="#fff" stroke="currentColor"/><path d="M20 29v10M15 34h10M41 31h.1M47 37h.1"/></symbol><symbol id="star" viewBox="0 0 64 64"><path d="m32 7 7 15 16 2-12 11 3 16-14-8-14 8 3-16L9 24l16-2z" fill="#ffd861" stroke="#d9a32b"/></symbol><symbol id="cat" viewBox="0 0 80 80"><path d="M20 29 24 14l14 10h4l14-10 4 15v18c0 14-9 23-20 23S20 61 20 47z" fill="#ffd1df" stroke="#8f6076"/><path d="M31 43h.1M49 43h.1M34 53c4 3 8 3 12 0"/></symbol><symbol id="dog" viewBox="0 0 80 80"><path d="M23 24 12 17l2 26 12 2M57 24l11-7-2 26-12 2" fill="#dba86c" stroke="#865b39"/><path d="M22 29c0-10 8-16 18-16s18 6 18 16v20c0 12-8 21-18 21s-18-9-18-21z" fill="#f0bd7f" stroke="#865b39"/><path d="M31 42h.1M49 42h.1M36 50h8l-4 5z"/></symbol><symbol id="panda" viewBox="0 0 80 80"><circle cx="24" cy="22" r="10" fill="#3a3651"/><circle cx="56" cy="22" r="10" fill="#3a3651"/><circle cx="40" cy="43" r="27" fill="#fff" stroke="#5b5672"/><ellipse cx="30" cy="40" rx="7" ry="10" fill="#3a3651"/><ellipse cx="50" cy="40" rx="7" ry="10" fill="#3a3651"/><circle cx="30" cy="40" r="2" fill="#fff"/><circle cx="50" cy="40" r="2" fill="#fff"/><path d="M36 53h8l-4 4z" fill="#3a3651"/></symbol><symbol id="bulb" viewBox="0 0 64 64"><path d="M21 27a11 11 0 1 1 22 0c0 8-7 9-7 17h-8c0-8-7-9-7-17z"/><path d="M27 49h10M29 55h6"/></symbol><symbol id="eye" viewBox="0 0 64 64"><path d="M7 32s9-14 25-14 25 14 25 14-9 14-25 14S7 32 7 32z"/><circle cx="32" cy="32" r="7"/></symbol><symbol id="play" viewBox="0 0 64 64"><path d="M24 16 49 32 24 48z" fill="currentColor" stroke="none"/></symbol><symbol id="trophy" viewBox="0 0 64 64"><path d="M20 10h24v12c0 11-5 18-12 18s-12-7-12-18z" fill="#ffd861" stroke="#b68426"/><path d="M20 17H10v5c0 8 5 12 12 12M44 17h10v5c0 8-5 12-12 12M32 40v8M22 54h20"/></symbol></defs></svg><main class="app"><header class="top"><div class="brand"><div class="logo"><svg class="icon"><use href="#game"/></svg></div>เปิดป้ายดิ</div><div class="hud"><div class="chip">แต้ม <b id="hudScore">0</b></div><div class="chip">ด่าน <b id="hudRound">1/3</b></div></div></header><section id="home" class="screen on"><div class="hero"><span class="tag"><svg class="icon"><use href="#star"/></svg>คิวต์แต่ป่วน</span><h1>เปิดน้อยๆ<br><b>เดี๋ยวแต้มปลิว!</b></h1><p>ค่อยๆ แง้ม แล้วเดาให้ไว เปิดหมดไม่ผิดหรอก...แค่แต้มมันเศร้าเฉยๆ</p><div class="actions"><button class="btn" id="quickPlay"><svg class="icon"><use href="#play"/></svg>เอาดิ ลุยเลย</button></div></div><div class="section"><h2>เลือกด่าน แล้วไปป่วนกัน</h2><div class="missions" id="missions"></div></div></section><section id="play" class="screen"><div class="playCard"><div class="playHead"><div class="roundBox" id="roundNo">01</div><div><div id="roundLabel" style="font:600 12px Mitr">รอบ 1 / 3</div><div class="progress"><i id="prog" style="width:33%"></i></div></div><div class="score"><span id="roundScore">1000</span> แต้ม</div></div><h2 class="question" id="question"></h2><div class="board"><div class="picture" id="picture"></div><div class="tiles" id="tiles"></div></div><div class="tools"><button class="btn alt" id="hint"><svg class="icon"><use href="#bulb"/></svg>ใบ้ให้ก็ได้</button><button class="btn alt" id="reveal"><svg class="icon"><use href="#eye"/></svg>แอบดูเฉลย</button></div><div class="answer"><input id="guess" placeholder="พิมพ์มาเลย เดี๋ยวรู้กัน..." autocomplete="off" autocorrect="off" enterkeyhint="done"><button class="btn" id="submit">ล็อกคำตอบ!</button></div><div class="msg" id="msg"></div><div class="actions hidden" id="nextWrap"><button class="btn" id="next">ไปต่อดิ</button></div></div></section><section id="result" class="screen"><div class="result"><svg class="icon" style="width:86px;height:86px;color:#d19a25"><use href="#trophy"/></svg><h1>รอดเฉย!</h1><div class="stars" id="stars"></div><div class="big" id="finalScore">0</div><div>แต้มรวม แบบไม่โกงนะ</div><div class="stats"><div><small>เดาถูก</small><strong id="correct">0/3</strong></div><div><small>แง้มไป</small><strong id="opened">0</strong></div><div><small>พลาดไป</small><strong id="wrong">0</strong></div></div><div class="actions"><button class="btn" id="again">เอาใหม่ดิ</button><button class="btn alt" id="back">กลับไปเลือกด่าน</button></div></div></section></main><script>
const $=id=>document.getElementById(id);const MISSIONS=[{id:'cat',title:'เจ้าเหมียวสายลับ',desc:'ตัวแรกเบาๆ อย่าเพิ่งรีบเปิดหมด',icon:'cat',q:'ใครทำหน้าเหมือนไม่สนใจโลก?',a:['แมว','cat'],h:'ชอบกล่อง ชอบนอน ชอบเมินเรา',g:3},{id:'dog',title:'เจ้าตูบจับโป๊ะ',desc:'รอบนี้เริ่มตึงนิดนึง',icon:'dog',q:'ใครดีใจเหมือนเราเพิ่งกลับจากต่างดาว?',a:['หมา','สุนัข','dog'],h:'หางนี่ฟ้องหมดแล้ว',g:4},{id:'panda',title:'แพนด้าหน้าง่วง',desc:'น่ารักแต่เปิดเยอะก็โดนหักนะ',icon:'panda',q:'ใครใส่แว่นดำมาตั้งแต่เกิด?',a:['แพนด้า','panda'],h:'ดำขาว กินไผ่ ไม่ใช่ม้าลาย',g:4}];let game=null,ri=0,total=0,opened=0,wrong=0,correct=0,openedSet=new Set(),done=false,hinted=false;function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');window.scrollTo({top:0,behavior:'instant'})}function icon(id,cls=''){return `<svg class="icon ${cls}"><use href="#${id}"/></svg>`}function renderMissions(){$('missions').innerHTML=MISSIONS.map((m,i)=>`<article class="mission"><div class="art">${icon(m.icon)}</div><div class="mBody"><h3>${m.title}</h3><p>${m.desc}</p><button class="btn start" data-i="${i}">${icon('play')}เล่นด่านนี้</button></div></article>`).join('');document.querySelectorAll('.start').forEach(b=>b.onclick=()=>start(+b.dataset.i))}function start(idx=0){game=MISSIONS;ri=idx;total=0;opened=0;wrong=0;correct=0;loadRound();show('play')}function score(){return Math.max(0,1000-openedSet.size*50-wrong*100-(hinted?150:0))}function loadRound(){openedSet=new Set();done=false;hinted=false;$('msg').textContent='';$('guess').value='';$('nextWrap').classList.add('hidden');draw()}function draw(){const r=game[ri];$('hudScore').textContent=total.toLocaleString();$('hudRound').textContent=`${ri+1}/3`;$('roundNo').textContent=String(ri+1).padStart(2,'0');$('roundLabel').textContent=`รอบ ${ri+1} / 3`;$('prog').style.width=`${(ri+1)/3*100}%`;$('roundScore').textContent=score();$('question').textContent=r.q;$('picture').innerHTML=icon(r.icon);$('tiles').style.gridTemplateColumns=`repeat(${r.g},1fr)`;$('tiles').innerHTML=Array.from({length:r.g*r.g},(_,n)=>`<button class="tile ${openedSet.has(n)?'open':''}" data-n="${n}" ${done?'disabled':''}>${n+1}</button>`).join('');document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(done)return;openedSet.add(+b.dataset.n);opened++;draw()});$('hint').disabled=hinted||done;$('reveal').disabled=done;$('submit').disabled=done;$('guess').disabled=done}function submit(){if(done)return;const r=game[ri],v=$('guess').value.trim().toLowerCase();if(!v)return;if(r.a.some(a=>a.toLowerCase()===v)){const s=score();total+=s;correct++;done=true;$('msg').textContent=`เอ้า ถูกเฉย! +${s.toLocaleString()} แต้ม`;$('msg').style.color='#48a84d';for(let i=0;i<r.g*r.g;i++)openedSet.add(i);$('nextWrap').classList.remove('hidden');$('next').textContent=ri===2?'ไปดูผลงาน':'ไปต่อดิ';draw()}else{wrong++;$('msg').textContent='อุ๊ย ไม่ใช่! แง้มเพิ่มอีกหน่อยมั้ย';$('msg').style.color='#e35182';$('guess').value='';draw()}}function reveal(){if(done)return;const r=game[ri];done=true;$('msg').textContent=`เฉลยให้ก็ได้: ${r.a[0]}`;for(let i=0;i<r.g*r.g;i++)openedSet.add(i);$('nextWrap').classList.remove('hidden');$('next').textContent=ri===2?'ไปดูผลงาน':'ไปต่อดิ';draw()}function next(){if(ri<2){ri++;loadRound()}else finish()}function finish(){show('result');$('finalScore').textContent=total.toLocaleString();$('correct').textContent=`${correct}/3`;$('opened').textContent=opened;$('wrong').textContent=wrong;const st=correct===3?3:correct>=2?2:correct?1:0;$('stars').innerHTML=Array.from({length:3},(_,i)=>`<svg class="icon" style="color:${i<st?'#d9a32b':'#d9cce9'};fill:${i<st?'#ffd861':'#fff'}"><use href="#star"/></svg>`).join('')}renderMissions();$('quickPlay').onclick=()=>start(0);$('submit').onclick=submit;$('guess').onkeydown=e=>{if(e.key==='Enter')submit()};$('hint').onclick=()=>{if(!hinted&&!done){hinted=true;$('msg').textContent='ใบ้ให้ละนะ: '+game[ri].h;draw()}};$('reveal').onclick=reveal;$('next').onclick=next;$('again').onclick=()=>start(0);$('back').onclick=()=>show('home');
</script></body></html>
