<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff86bf">
<title>เปิดป้ายดิ — เปิดป้ายเลข 1–9</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4d3b70;--muted:#7d7190;--pink:#ff73b5;--blue:#6bd7f2;--yellow:#ffd960;--line:#e4d8f5;--shadow:#c7b3e8}*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}body{font-family:"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 8%,#fff 0 48px,transparent 50px),radial-gradient(circle at 90% 14%,#fff 0 34px,transparent 36px),linear-gradient(#c6f1ff,#e7ddff 46%,#fff0f7 78%,#fff8d8);padding-bottom:env(safe-area-inset-bottom)}button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.app{width:min(100%,980px);margin:auto;padding:12px 12px calc(28px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border-radius:0 0 22px 22px;padding:9px 11px;box-shadow:0 6px 0 var(--shadow);margin-bottom:18px}.brand{font:600 19px Mitr,sans-serif}.chip{border:2px solid #ffe275;background:#fff8c8;border-radius:999px;padding:7px 10px;font:600 12px Mitr,sans-serif}.screen{display:none}.screen.on{display:block}.card{background:#fff;border:4px solid #fff;border-radius:28px;box-shadow:0 8px 0 var(--shadow);padding:16px}.hero{background:linear-gradient(145deg,#fff,#fff6fb 60%,#fff8d5);padding:24px 18px}.hero h1{font:700 clamp(36px,10vw,60px)/1.05 Mitr,sans-serif;margin:10px 0;color:#553d81}.hero h1 b{color:var(--pink)}.hero p{color:var(--muted);line-height:1.65}.tag{display:inline-flex;border:2px solid #ffdb64;background:#fff1b2;border-radius:999px;padding:6px 10px;font:600 11px Mitr,sans-serif}.btn{min-height:50px;border:2px solid #fff;border-radius:17px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font:600 15px Mitr,sans-serif;color:#fff;background:linear-gradient(#ff9dce,#ff68ad);box-shadow:0 6px 0 #cf4389}.btn.alt{background:linear-gradient(#87e0f6,#59caeb);box-shadow:0 6px 0 #38a9c9;color:#2b536a}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a74178}.btn:disabled{opacity:.5}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.head{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;border-bottom:2px dashed #eadcf8;padding-bottom:10px}.round{width:52px;height:52px;border-radius:15px;background:linear-gradient(#a28df8,#7a61e8);color:#fff;display:grid;place-items:center;font:600 19px Mitr,sans-serif;box-shadow:0 4px 0 #5a45bd}.progress{height:10px;background:#efe8fa;border:2px solid #dfd3f2;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--pink),var(--yellow))}.question{font:600 clamp(23px,6vw,32px) Mitr,sans-serif;margin:16px 0 4px}.sub{font-size:14px;color:var(--muted);margin-bottom:14px}.board{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:auto;border:5px solid #fff;border-radius:24px;background:#8068e8;box-shadow:0 7px 0 #654ecb;overflow:hidden}.picture{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#fff5bd,#ffdcef,#dff8ff)}.picture svg{width:44%;height:44%}.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0}.tile{border:1px solid rgba(255,255,255,.75);border-radius:0;background:linear-gradient(#ff9ece,#ff6fad);color:#fff;font:700 clamp(26px,9vw,44px) Mitr,sans-serif;text-shadow:0 2px 0 rgba(94,45,104,.22);display:grid;place-items:center}.tile:nth-child(3n+2){background:linear-gradient(#7cdef6,#4fc4e6)}.tile:nth-child(4n){background:linear-gradient(#ffdc6c,#ffc142);color:#704c13;text-shadow:0 2px 0 rgba(255,255,255,.3)}.tile:active{filter:brightness(.94);transform:scale(.985)}.tile.open{opacity:0;pointer-events:none}.answer{margin-top:14px;text-align:center;background:#fff9fe;border:2px solid var(--line);border-radius:18px;padding:13px}.answer small{display:block;color:var(--muted)}.answer strong{font:700 clamp(24px,6vw,34px) Mitr,sans-serif;color:#ef5ba0}.hidden{display:none!important}.version{position:fixed;right:8px;bottom:8px;font:500 10px Mitr,sans-serif;color:#76698b;background:#ffffffcc;border:1px solid #e6dcf4;border-radius:999px;padding:4px 7px;z-index:50}@media(max-width:760px){.top{margin-left:-12px;margin-right:-12px}.actions .btn{flex:1 1 150px}.card{padding:12px}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
<symbol id="cat" viewBox="0 0 80 80"><path d="M20 29 24 14l14 10h4l14-10 4 15v18c0 14-9 23-20 23S20 61 20 47z" fill="#ffd1df" stroke="#8f6076"/><path d="M31 43h.1M49 43h.1M34 53c4 3 8 3 12 0"/></symbol>
<symbol id="dog" viewBox="0 0 80 80"><path d="M23 24 12 17l2 26 12 2M57 24l11-7-2 26-12 2" fill="#dba86c" stroke="#865b39"/><path d="M22 29c0-10 8-16 18-16s18 6 18 16v20c0 12-8 21-18 21s-18-9-18-21z" fill="#f0bd7f" stroke="#865b39"/><path d="M31 42h.1M49 42h.1M36 50h8l-4 5z"/></symbol>
<symbol id="panda" viewBox="0 0 80 80"><circle cx="24" cy="22" r="10" fill="#3a3651"/><circle cx="56" cy="22" r="10" fill="#3a3651"/><circle cx="40" cy="43" r="27" fill="#fff" stroke="#5b5672"/><ellipse cx="30" cy="40" rx="7" ry="10" fill="#3a3651"/><ellipse cx="50" cy="40" rx="7" ry="10" fill="#3a3651"/><circle cx="30" cy="40" r="2" fill="#fff"/><circle cx="50" cy="40" r="2" fill="#fff"/></symbol>
<symbol id="rabbit" viewBox="0 0 80 80"><path d="M28 13c0-8 6-11 10-3l5 11M47 13c0-8 6-11 10-3l1 14" fill="#ffdbe8" stroke="#8f6076"/><circle cx="40" cy="44" r="24" fill="#fff1f6" stroke="#8f6076"/><path d="M31 43h.1M49 43h.1"/></symbol>
<symbol id="bear" viewBox="0 0 80 80"><circle cx="24" cy="24" r="9" fill="#bd8a58"/><circle cx="56" cy="24" r="9" fill="#bd8a58"/><circle cx="40" cy="44" r="25" fill="#d9a36b" stroke="#754b25"/><path d="M32 42h.1M48 42h.1"/></symbol>
<symbol id="apple" viewBox="0 0 80 80"><path d="M42 20c4-6 10-8 14-6-1 6-6 9-14 10" fill="#59b85e"/><path d="M39 25c-10-8-24 1-24 18 0 14 11 27 25 27s25-13 25-27c0-17-14-26-24-18z" fill="#ff6a7d" stroke="#c73f53"/></symbol>
<symbol id="strawberry" viewBox="0 0 80 80"><path d="M27 23c4-7 22-7 26 0l9 7H18z" fill="#60bb65"/><path d="M40 68c-14 0-22-11-22-24 0-13 9-23 22-23s22 10 22 23c0 13-8 24-22 24z" fill="#ff648b" stroke="#c93c64"/></symbol>
<symbol id="pizza" viewBox="0 0 80 80"><path d="M12 22c19-8 38-8 56 0L40 68z" fill="#ffd86d" stroke="#d89f2e"/><path d="M18 24c14-5 30-5 44 0L40 60z" fill="#ff8b7f"/></symbol>
<symbol id="car" viewBox="0 0 80 80"><path d="M18 49h44l-4-16H28z" fill="#68c9f0" stroke="#2f87ae"/><circle cx="28" cy="53" r="6"/><circle cx="52" cy="53" r="6"/></symbol>
<symbol id="rocket" viewBox="0 0 80 80"><path d="M45 13c11 4 18 23 11 34L43 60 30 47l13-13c11-7 6-17 2-21z" fill="#d6dbff" stroke="#6d73a8"/><circle cx="46" cy="31" r="5" fill="#6bd7f2"/></symbol>
</defs></svg>
<main class="app">
<header class="top"><div class="brand">🎮 เปิดป้ายดิ</div><div class="chip">รูป <b id="counter">1/10</b></div></header>
<section id="home" class="screen on"><div class="card hero"><span class="tag">เปิดป้าย 3×3</span><h1>เลือกเลข<br><b>แล้วเปิดทีละป้าย</b></h1><p>1 เซ็ตมี 10 รูป กดป้ายเลข 1–9 เพื่อเปิดดูภาพทีละส่วน หรือกดเฉลยเพื่อเปิดทั้งหมด</p><div class="actions"><button class="btn" id="start">เริ่มเล่น</button></div></div></section>
<section id="viewer" class="screen"><div class="card"><div class="head"><div class="round" id="round">01</div><div><div id="label" style="font:600 12px Mitr">รูปที่ 1 / 10</div><div class="progress"><i id="progress" style="width:10%"></i></div></div></div><h2 class="question">เปิดป้ายดูภาพกัน</h2><div class="sub">แตะเลข 1–9 เพื่อเปิดเฉพาะช่องนั้น</div><div class="board"><div class="picture" id="picture"></div><div class="tiles" id="tiles"></div></div><div class="answer"><small>เฉลย</small><strong id="answer">ยังไม่บอกหรอก</strong></div><div class="actions"><button class="btn alt" id="reveal">เฉลย / เปิดทั้งหมด</button><button class="btn hidden" id="next">รูปถัดไป</button></div></div></section>
<section id="done" class="screen"><div class="card hero" style="text-align:center"><span class="tag">ครบ 10 รูปแล้ว</span><h1>จบเซ็ตแล้ว</h1><div class="actions" style="justify-content:center"><button class="btn" id="restart">เล่นใหม่</button><button class="btn alt" id="back">หน้าแรก</button></div></div></section>
</main><div class="version">v18</div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const ITEMS=[['แมว','cat'],['หมา','dog'],['แพนด้า','panda'],['กระต่าย','rabbit'],['หมี','bear'],['แอปเปิล','apple'],['สตรอว์เบอร์รี','strawberry'],['พิซซ่า','pizza'],['รถ','car'],['จรวด','rocket']];let index=0,revealed=false,opened=new Set();function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');window.scrollTo(0,0)}function drawTiles(){$('tiles').innerHTML=Array.from({length:9},(_,i)=>`<button class="tile ${(revealed||opened.has(i))?'open':''}" data-i="${i}" aria-label="เปิดป้าย ${i+1}">${i+1}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.addEventListener('click',()=>{const i=Number(b.dataset.i);if(revealed||opened.has(i))return;opened.add(i);drawTiles()}))}function draw(){const [ans,pic]=ITEMS[index];$('counter').textContent=`${index+1}/10`;$('round').textContent=String(index+1).padStart(2,'0');$('label').textContent=`รูปที่ ${index+1} / 10`;$('progress').style.width=`${(index+1)*10}%`;$('picture').innerHTML=`<svg viewBox="0 0 80 80"><use href="#${pic}"/></svg>`;$('answer').textContent=revealed?ans:'ยังไม่บอกหรอก';drawTiles();$('reveal').disabled=revealed;$('next').classList.toggle('hidden',!revealed);$('next').textContent=index===9?'ดูสรุป':'รูปถัดไป'}function start(){index=0;revealed=false;opened=new Set();draw();show('viewer')}function reveal(){revealed=true;opened=new Set([0,1,2,3,4,5,6,7,8]);draw()}function next(){if(index<9){index++;revealed=false;opened=new Set();draw();show('viewer')}else show('done')}$('start').addEventListener('click',start);$('reveal').addEventListener('click',reveal);$('next').addEventListener('click',next);$('restart').addEventListener('click',start);$('back').addEventListener('click',()=>show('home'));})();
</script>
</body>
</html>
